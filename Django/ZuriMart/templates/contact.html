<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <style>
        body { font-family: "Times New Roman", serif; text-align: center; }
        .form-box {
            width: 210px;
            margin: 0 auto;
            padding: 12px;
            border: 1px solid #555;
            text-align: left;
        }
        .row { display: flex; align-items: center; margin: 12px 0; }
        .row label { width: 80px; }
        .row input { width: 100px; }
        input:required { border: 1px solid #c8c800; background: #ffffe0; }
        fieldset { margin: 12px 0; }
        textarea { width: 190px; height: 50px; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
<h1>Contact Form</h1>
<p>Please enter your details:</p>

{% if success %}
    <p class="success">Thank you, {{ data.first_name }}! Your details have been received.</p>
{% endif %}
{% if error %}
    <p class="error">{{ error }}</p>
{% endif %}

<div class="form-box">
    <form method="post" action="">
        {% csrf_token %}
        <p>Required fields are marked with an asterisk.</p>

        <div class="row">
            <label for="first_name">*First name:</label>
            <input type="text" id="first_name" name="first_name" value="{{ data.first_name|default:'' }}" required>
        </div>
        <div class="row">
            <label for="last_name">*Last name:</label>
            <input type="text" id="last_name" name="last_name" value="{{ data.last_name|default:'' }}" required>
        </div>
        <div class="row">
            <label for="email">*Email:</label>
            <input type="email" id="email" name="email" value="{{ data.email|default:'' }}" required>
        </div>
        <div class="row">
            <label for="tel">Tel:</label>
            <input type="tel" id="tel" name="tel" value="{{ data.tel|default:'' }}">
        </div>
        <div class="row">
            <label for="fax">Fax:</label>
            <input type="tel" id="fax" name="fax" value="{{ data.fax|default:'' }}">
        </div>
        <div class="row">
            <label for="mob">Mob:</label>
            <input type="tel" id="mob" name="mob" value="{{ data.mob|default:'' }}">
        </div>
        <div class="row">
            <label for="dob">*Date of Birth:</label>
            <input type="date" id="dob" name="dob" value="{{ data.dob|default:'' }}" required>
        </div>

        <fieldset>
            <legend>Gender*</legend>
            <label><input type="radio" name="gender" value="male" required> Male</label><br>
            <label><input type="radio" name="gender" value="female"> Female</label><br>
            <label><input type="radio" name="gender" value="non-binary"> Non-binary</label>
        </fieldset>

        <label for="comment">Leave a comment:</label><br>
        <textarea id="comment" name="comment">{{ data.comment|default:'' }}</textarea>

        <p><button type="submit">Submit</button></p>
    </form>
</div>
</body>
</html>
